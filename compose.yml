services:
  server:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      CROWNLINE_PUBLIC_URL: "http://localhost:5000"
      RUST_LOG: "crownline_server=info,tower_http=info"
    volumes:
      - crownline-data:/var/lib/crownline
    stop_grace_period: 20s

volumes:
  crownline-data:
